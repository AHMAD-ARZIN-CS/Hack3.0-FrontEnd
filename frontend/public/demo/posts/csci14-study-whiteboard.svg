<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>A study room whiteboard with a C++ for loop, a note saying loops and functions, and sticky notes.</title>
  <rect width="1200" height="750" fill="#e5e4df"/>
  <rect x="0" y="600" width="1200" height="150" fill="#9a6516" opacity="0.55"/>
  <rect x="80" y="50" width="1040" height="520" rx="12" fill="#8b9aa3"/>
  <rect x="98" y="66" width="1004" height="488" rx="6" fill="#fbfbf8"/>
  <g font-family="'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive">
    <text x="150" y="140" font-size="44" font-weight="700" fill="#b0450f">CSCI 14: loops + functions</text>
    <path d="M150 158 q 260 14 560 -4" stroke="#b0450f" stroke-width="4" fill="none"/>
  </g>
  <g font-family="'Courier New', Courier, monospace" font-size="32" fill="#17252f">
    <text x="160" y="240">for (int i = 0; i &lt; n; i++) {</text>
    <text x="210" y="290"><tspan fill="#4a6a4c">total</tspan> += scores[i];</text>
    <text x="160" y="340">}</text>
    <text x="160" y="420">int square(int x) { return x * x; }</text>
  </g>
  <g font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#b4381f">
    <text x="720" y="300">← runs n times</text>
    <text x="160" y="490">off-by-one?  i &lt;= n  ✗</text>
  </g>
  <g transform="translate(900 380) rotate(4)"><rect width="150" height="140" fill="#e6a23c"/>
    <text x="16" y="50" font-family="'Comic Sans MS', cursive" font-size="24" fill="#17252f">Lab 4 due</text>
    <text x="16" y="88" font-family="'Comic Sans MS', cursive" font-size="24" fill="#17252f">Friday!</text></g>
  <g transform="translate(900 110) rotate(-5)"><rect width="150" height="140" fill="#d8452a"/>
    <text x="16" y="50" font-family="'Comic Sans MS', cursive" font-size="24" fill="#17252f">bring</text>
    <text x="16" y="88" font-family="'Comic Sans MS', cursive" font-size="24" fill="#17252f">laptop</text></g>
  <g transform="translate(280 610)">
    <rect width="300" height="100" rx="10" fill="#17252f"/><rect x="16" y="12" width="268" height="72" rx="4" fill="#b0450f" opacity="0.8"/>
  </g>
  <g transform="translate(700 620)"><rect width="200" height="30" rx="4" fill="#fdfcf7"/><rect y="34" width="200" height="30" rx="4" fill="#8faa8b"/></g>
  <rect x="1010" y="20" width="116" height="40" rx="8" fill="#17252f" opacity="0.6"/>
  <text x="1068" y="47" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">DEMO</text>
</svg>
